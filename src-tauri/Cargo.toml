[package]
name = "token-usage-lab"
version = "0.1.0"
description = "Local, read-only cross-tool usage collector derived from CC Switch"
license = "MIT"
edition = "2021"
rust-version = "1.85"
default-run = "token-usage-lab"
autobins = false
autotests = false

[lib]
name = "token_usage_lab"
crate-type = ["rlib"]

[[bin]]
name = "token-usage-lab"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "usage-lab-cli"
path = "src/usage_cli.rs"
required-features = ["cli"]

[features]
default = []
cli = []
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
dirs = "5"
log = "0.4"
tauri = { version = "2.8.2", optional = true, features = [] }

[build-dependencies]
tauri-build = { version = "2.4.0", optional = true, features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true

[profile.dev]
debug = 0
