name: Build macOS Internal Tryout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-internal-tryout
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: apple-silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: intel
    env:
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.12.3 --activate
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0
      - name: Check source integrity
        run: node scripts/check-source.mjs
      - name: Build app and disk image
        run: bash scripts/build-macos.sh '${{ matrix.target }}'
      - name: Test final disk image and stage delivery
        run: node scripts/package-macos.mjs '${{ matrix.target }}'
      - name: Upload installable internal tryout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TokenUsageLab-macos-${{ matrix.label }}-${{ github.run_id }}
          path: release/macos/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.label }}-startup-evidence-${{ github.run_id }}
          path: |
            .acceptance/macos-startup-*.png
            .acceptance/macos-startup-*.log
            .acceptance/macos-package.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
