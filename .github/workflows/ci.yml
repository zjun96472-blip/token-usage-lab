name: Source Checks

on:
  push:
    branches: [canonical]
  pull_request:
    branches: [canonical]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install locked tools and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.12.3 --activate
          pnpm install --frozen-lockfile
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0
      - name: Source and package checks
        run: |
          node scripts/check-source.mjs
          node scripts/audit-public-source.mjs
          node --test scripts/tests/*.test.mjs
          pnpm typecheck
          pnpm test:unit
      - name: Synthetic collector tests and renderer build
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features cli --bin usage-lab-cli
          pnpm build:renderer
